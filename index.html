<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f4e78">
<link rel="manifest" href="manifest.json">
<title>برنامج الساكنة</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial;
background:#f4f6f8;
color:#17324d
}

header{
background:#1f4e78;
color:white;
padding:18px;
text-align:center
}

h1{
margin:0;
font-size:22px
}

main{
max-width:700px;
margin:auto;
padding:14px
}

.card{
background:white;
border-radius:16px;
padding:16px;
margin:12px 0;
box-shadow:0 2px 10px #0001
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.btn{
border:0;
border-radius:12px;
padding:14px;
font-size:16px;
background:#e7f0f7;
color:#17324d;
cursor:pointer
}

.primary{
background:#1f4e78;
color:white
}

.danger{
background:#fbe4e4;
color:#9b1c1c
}

.full{
width:100%
}

.hidden{
display:none
}

input,textarea{
width:100%;
padding:12px;
border:1px solid #ccd5dd;
border-radius:10px;
font-size:16px;
margin:6px 0 12px
}

label{
font-weight:bold
}

.row{
display:flex;
justify-content:space-between;
align-items:center
}

.person{
padding:12px;
border:1px solid #ddd;
border-radius:12px;
margin:8px 0
}

.muted{
color:#687784;
font-size:13px
}

.notice{
background:#fff8df;
border:1px solid #ead58a;
border-radius:12px;
padding:12px;
margin:10px 0;
line-height:1.6
}

@media(max-width:480px){
.grid{
grid-template-columns:1fr
}
}
</style>
</head>

<body>

<header>
<h1>قاعدة بيانات الساكنة</h1>
<div>قيادة صخور الرحامنة</div>
</header>

<main>

<section id="home" class="card">

<div class="grid">

<button class="btn primary" onclick="show('search')">
🔎 البحث عن شخص
</button>

<button class="btn" onclick="newPerson()">
➕ إضافة شخص
</button>

<button class="btn" onclick="showAll()">
📋 جميع الأشخاص
</button>

<button class="btn" onclick="backupJSON()">
💾 نسخة احتياطية
</button>

<button class="btn" onclick="document.getElementById('restoreFile').click()">
📥 استعادة نسخة
</button>

<button class="btn" onclick="exportCSV()">
📊 تصدير إلى Excel
</button>

</div>

<input
id="restoreFile"
type="file"
accept=".json,application/json"
class="hidden"
onchange="restoreJSON(event)"
>

<div class="notice">
<b>عدد السجلات:</b>
<span id="count">0</span>
</div>

</section>


<section id="search" class="card hidden">

<div class="row">

<h2>البحث</h2>

<button class="btn" onclick="home()">
الرئيسية
</button>

</div>

<input
id="q"
placeholder="الاسم أو رقم البطاقة الوطنية"
oninput="search()"
>

<div id="results"></div>

</section>


<section id="list" class="card hidden">

<div class="row">

<h2>جميع الأشخاص</h2>

<button class="btn" onclick="home()">
الرئيسية
</button>

</div>

<div id="all"></div>

</section>


<section id="form" class="card hidden">

<div class="row">

<h2 id="ft">
إضافة شخص
</h2>

<button class="btn" onclick="home()">
الرئيسية
</button>

</div>


<form onsubmit="save(event)">

<label>الاسم الكامل</label>
<input id="name" required>

<label>رقم البطاقة الوطنية</label>
<input id="cin" required>

<label>اسم الأب</label>
<input id="father">

<label>اسم الأم</label>
<input id="mother">

<label>العنوان</label>
<input id="address">

<label>الزوج/الزوجة</label>
<input id="spouse">

<label>تاريخ الميلاد</label>
<input id="birth" type="date">

<label>الهاتف</label>
<input id="phone">

<label>ملاحظات</label>
<textarea id="notes"></textarea>

<button class="btn primary full" type="submit">
حفظ
</button>

</form>

</section>


<section id="detail" class="card hidden">

<div class="row">

<h2>بيانات الشخص</h2>

<button class="btn" onclick="home()">
الرئيسية
</button>

</div>

<div id="details"></div>

</section>

</main>


<script>

const KEY="residents_v1";


const F=[
["name","الاسم الكامل"],
["cin","رقم البطاقة الوطنية"],
["father","اسم الأب"],
["mother","اسم الأم"],
["address","العنوان"],
["spouse","الزوج/الزوجة"],
["birth","تاريخ الميلاد"],
["phone","الهاتف"],
["notes","ملاحظات"]
];


let data=JSON.parse(
localStorage.getItem(KEY)||"[]"
);

let editId=null;



function saveDB(){

localStorage.setItem(
KEY,
JSON.stringify(data)
);

updateCount();

}



function updateCount(){

document.getElementById("count").textContent=data.length;

}



function hide(){

document
.querySelectorAll("section")
.forEach(x=>x.classList.add("hidden"));

}



function show(id){

hide();

document
.getElementById(id)
.classList.remove("hidden");

}



function home(){

show("home");

updateCount();

}



function newPerson(){

editId=null;

document
.querySelector("form")
.reset();

document
.getElementById("ft")
.textContent="إضافة شخص";

show("form");

}



function save(e){

e.preventDefault();

let r={};

F.forEach(([id])=>{

r[id]=document
.getElementById(id)
.value
.trim();

});


let key=r.cin.toUpperCase();


if(editId===null){

if(
data.some(
x=>
x.cin &&
x.cin.toUpperCase()===key
)
){

alert(
"رقم البطاقة الوطنية موجود مسبقًا"
);

return;

}

data.push(r);

}

else{

let i=data.findIndex(
x=>x.cin===editId
);

if(i<0)return;


if(
data.some(
(x,j)=>
j!==i &&
x.cin &&
x.cin.toUpperCase()===key
)
){

alert(
"رقم البطاقة الوطنية موجود مسبقًا"
);

return;

}

data[i]=r;

}


saveDB();

alert("تم حفظ البيانات بنجاح");

home();

}



function search(){

let q=
document
.getElementById("q")
.value
.toLowerCase();


let r=data.filter(
x=>
(x.name||"")
.toLowerCase()
.includes(q)
||
(x.cin||"")
.toLowerCase()
.includes(q)
);


document
.getElementById("results")
.innerHTML=
r.map(card).join("")
||
(q?"<p>لا توجد نتائج</p>":"");

}



function card(r){

return `
<div class="person">

<b>${esc(r.name)}</b>

<div class="muted">
رقم البطاقة:
${esc(r.cin)}
</div>

<div>
${esc(r.address||"")}
</div>

<div class="grid">

<button
class="btn"
onclick="detail('${enc(r.cin)}')">
عرض
</button>

<button
class="btn"
onclick="edit('${enc(r.cin)}')">
تعديل
</button>

</div>

</div>
`;

}



function showAll(){

document
.getElementById("all")
.innerHTML=
data.map(card).join("")
||
"<p>لا توجد بيانات.</p>";

show("list");

}



function detail(c){

let r=data.find(
x=>x.cin===dec(c)
);

if(!r)return;


document
.getElementById("details")
.innerHTML=

F.map(
([id,l])=>
`<p>
<b>${l}:</b>
${esc(r[id]||"")}
</p>`
)
.join("")

+

`
<div class="grid">

<button
class="btn primary"
onclick="edit('${enc(r.cin)}')">
تعديل
</button>

<button
class="btn danger"
onclick="del('${enc(r.cin)}')">
حذف
</button>

</div>
`;


show("detail");

}



function edit(c){

let r=data.find(
x=>x.cin===dec(c)
);

if(!r)return;


editId=r.cin;


F.forEach(([id])=>{

document
.getElementById(id)
.value=r[id]||"";

});


document
.getElementById("ft")
.textContent=
"تعديل بيانات الشخص";


show("form");

}



function del(c){

let id=dec(c);


if(
confirm(
"هل تريد حذف هذا السجل؟"
)
){

data=data.filter(
x=>x.cin!==id
);

saveDB();

alert("تم حذف السجل");

home();

}

}



/* =========================
   النسخة الاحتياطية JSON
   ========================= */

function backupJSON(){

if(data.length===0){

alert("لا توجد بيانات لإنشاء نسخة احتياطية.");

return;

}


let b=new Blob(
[
JSON.stringify(
data,
null,
2
)
],
{
type:"application/json;charset=utf-8"
}
);


let a=document.createElement("a");

a.href=
URL.createObjectURL(b);

a.download=
"نسخة_احتياطية_الساكنة.json";

a.click();

URL.revokeObjectURL(a.href);

}



/* =========================
   استعادة النسخة الاحتياطية
   ========================= */

function restoreJSON(event){

let file=event.target.files[0];

if(!file)return;


let reader=new FileReader();


reader.onload=function(e){

try{

let imported=
JSON.parse(e.target.result);


if(!Array.isArray(imported)){

throw new Error();

}


let valid=imported.filter(
r=>
r &&
typeof r==="object" &&
r.cin
);


if(valid.length!==imported.length){

alert(
"النسخة تحتوي على سجلات غير صالحة."
);

return;

}


let existing={};

data.forEach(r=>{

if(r.cin){

existing[
r.cin.toUpperCase()
]=r;

}

});


let added=0;
let replaced=0;
let duplicates=0;


valid.forEach(r=>{

let k=r.cin.toUpperCase();


if(existing[k]){

duplicates++;

}
else{

existing[k]=r;

added++;

}

});


let message=
"عدد السجلات في النسخة: "+
valid.length+
"\n\n"+
"سجلات جديدة: "+
added+
"\n"+
"سجلات موجودة مسبقًا: "+
duplicates+
"\n\n"+
"هل تريد إضافة السجلات الجديدة فقط؟";


if(
confirm(message)
){

data=Object.values(existing);

saveDB();

alert(
"تمت استعادة السجلات الجديدة بنجاح.\n"+
"عدد السجلات المضافة: "+
added
);

}

}

catch(err){

alert(
"الملف غير صالح أو ليس نسخة احتياطية صحيحة."
);

}

event.target.value="";

};


reader.readAsText(file,"UTF-8");

}



/* =========================
   تصدير CSV لفتح البيانات
   في Excel
   ========================= */

function csvCell(value){

let s=String(value||"");

return '"'+
s.replace(/"/g,'""')+
'"';

}



function exportCSV(){

if(data.length===0){

alert("لا توجد بيانات لتصديرها.");

return;

}


let rows=[];


rows.push(
F.map(x=>csvCell(x[1])).join(";")
);


data.forEach(r=>{

rows.push(
F.map(
([id])=>
csvCell(r[id]||"")
)
.join(";")
);

});


let csv=
"\uFEFF"+
rows.join("\r\n");


let blob=new Blob(
[csv],
{
type:"text/csv;charset=utf-8;"
}
);


let a=document.createElement("a");

a.href=
URL.createObjectURL(blob);

a.download=
"بيانات_الساكنة.csv";

a.click();

URL.revokeObjectURL(a.href);

}



/* =========================
   أدوات مساعدة
   ========================= */

function enc(s){

return encodeURIComponent(s);

}



function dec(s){

return decodeURIComponent(s);

}



function esc(s){

return String(s).replace(
/[&<>"']/g,
c=>
({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c])
);

}



home();

</script>

</body>
</html>
